events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Client payload size (useful for large policy AST or schema definitions)
    client_max_body_size 50M;

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Core Backend Service (FastAPI APIs, Documentation & Health)
        location ~ ^/(api|docs|openapi\.json|redoc|health) {
            proxy_pass http://backend-service:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Snowflake Policy Connector (strip /connectors/snowflake prefix)
        location = /connectors/snowflake {
            return 301 /connectors/snowflake/;
        }
        location /connectors/snowflake/ {
            proxy_pass http://snowflake-connector:8006/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Redshift Policy Connector (strip /connectors/redshift prefix)
        location = /connectors/redshift {
            return 301 /connectors/redshift/;
        }
        location /connectors/redshift/ {
            proxy_pass http://redshift-connector:8007/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Open Policy Agent Engine (strip /opa prefix)
        location = /opa {
            return 301 /opa/;
        }
        location /opa/ {
            proxy_pass http://opa:8181/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Temporal Workflow UI Dashboard (strip /temporal prefix)
        location = /temporal {
            return 301 /temporal/;
        }
        location /temporal/ {
            proxy_pass http://temporal-ui:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Frontend Presentation Service (React SPA Catch-All)
        location / {
            proxy_pass http://frontend-service:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
