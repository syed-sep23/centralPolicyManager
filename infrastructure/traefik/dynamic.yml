# ==============================================================================
# Traefik v3 Dynamic Configuration - Enterprise Service Routing Mesh
# Location: infrastructure/traefik/dynamic.yml
# ==============================================================================

http:
  # ============================================================================
  # ROUTERS: Clean, Decoupled Ingress Endpoints for Every Microservice
  # ============================================================================
  routers:
    # --------------------------------------------------------------------------
    # 1. Traefik Gateway Control Plane Dashboard
    #    Access: http://localhost:8080/dashboard/ (Credentials: admin / adminpassword123)
    # --------------------------------------------------------------------------
    traefik-dashboard:
      rule: "PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      entryPoints:
        - "traefik"
      service: "api@internal"
      middlewares:
        - "dashboard-auth"

    # --------------------------------------------------------------------------
    # 2. Snowflake Policy Connector Microservice
    #    Access: http://localhost/connectors/snowflake/...
    # --------------------------------------------------------------------------
    snowflake-connector-router:
      rule: "PathPrefix(`/connectors/snowflake`)"
      entryPoints:
        - "web"
      priority: 200
      service: "snowflake-connector-service"
      middlewares:
        - "sec-headers"
        - "snowflake-stripprefix"

    # --------------------------------------------------------------------------
    # 3. Redshift Native DDM & RLS Connector Microservice
    #    Access: http://localhost/connectors/redshift/...
    # --------------------------------------------------------------------------
    redshift-connector-router:
      rule: "PathPrefix(`/connectors/redshift`)"
      entryPoints:
        - "web"
      priority: 200
      service: "redshift-connector-service"
      middlewares:
        - "sec-headers"
        - "redshift-stripprefix"

    # --------------------------------------------------------------------------
    # 4. Open Policy Agent (OPA) Policy Decision Engine
    #    Access: http://localhost/opa/...
    # --------------------------------------------------------------------------
    opa-router:
      rule: "PathPrefix(`/opa`)"
      entryPoints:
        - "web"
      priority: 150
      service: "opa-service"
      middlewares:
        - "sec-headers"
        - "opa-stripprefix"

    # --------------------------------------------------------------------------
    # 5. Temporal Workflow Execution Dashboard
    #    Access: http://localhost/temporal or http://localhost:8088
    # --------------------------------------------------------------------------
    temporal-ui-router:
      rule: "PathPrefix(`/temporal`)"
      entryPoints:
        - "web"
      priority: 150
      service: "temporal-ui-service"
      middlewares:
        - "sec-headers"
        - "temporal-stripprefix"

    # --------------------------------------------------------------------------
    # 6. Core Backend Service (FastAPI Governance Engine)
    #    Access: http://localhost/api/v1/... | http://localhost/docs
    # --------------------------------------------------------------------------
    core-backend-router:
      rule: "PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/redoc`) || PathPrefix(`/health`)"
      entryPoints:
        - "web"
      priority: 100
      service: "backend-service"
      middlewares:
        - "sec-headers"

    # --------------------------------------------------------------------------
    # 7. Frontend Presentation Service (React 18 / Mantine UI SPA)
    #    Access: http://localhost/ (Catch-all router)
    # --------------------------------------------------------------------------
    frontend-spa-router:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - "web"
      priority: 1
      service: "frontend-service"
      middlewares:
        - "sec-headers"

  # ============================================================================
  # SERVICES: Load Balancers & Internal DNS Resolution
  # ============================================================================
  services:
    frontend-service:
      loadBalancer:
        servers:
          - url: "http://frontend-service:80"

    backend-service:
      loadBalancer:
        servers:
          - url: "http://backend-service:8000"

    snowflake-connector-service:
      loadBalancer:
        servers:
          - url: "http://snowflake-connector:8006"

    redshift-connector-service:
      loadBalancer:
        servers:
          - url: "http://redshift-connector:8007"

    opa-service:
      loadBalancer:
        servers:
          - url: "http://opa:8181"

    temporal-ui-service:
      loadBalancer:
        servers:
          - url: "http://temporal-ui:8080"

  # ============================================================================
  # MIDDLEWARES: Security Headers, Path Stripping & Basic Authentication
  # ============================================================================
  middlewares:
    # --- Authentication Middleware ---
    dashboard-auth:
      basicAuth:
        users:
          - "admin:{SHA}f4MWA2s+v7KxRbCblH2OOyL5dNw="

    # --- Path Prefix Stripping for Microservices ---
    snowflake-stripprefix:
      stripPrefix:
        prefixes:
          - "/connectors/snowflake"

    redshift-stripprefix:
      stripPrefix:
        prefixes:
          - "/connectors/redshift"

    opa-stripprefix:
      stripPrefix:
        prefixes:
          - "/opa"

    temporal-stripprefix:
      stripPrefix:
        prefixes:
          - "/temporal"

    # --- Enterprise Security Headers Middleware ---
    sec-headers:
      headers:
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
          - "PATCH"
        accessControlAllowHeaders:
          - "*"
        accessControlAllowOriginList:
          - "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 3600
