# ==============================================================================
# Central Entitlement Service (CES) - Docker Compose (Production Architecture)
# Edge API Gateway: Nginx | Dual-Network Zero-Trust Topology
# Service Environment Files: Located inside respective parent directories
# ==============================================================================

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - internal-net
  depends_on:
    postgresql:
      condition: service_healthy

services:
  # ============================================================================
  # 1. Edge API Gateway & Reverse Proxy (Nginx)
  # ============================================================================
  gateway:
    image: nginx:alpine
    container_name: ces-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public-net
      - internal-net
    depends_on:
      - frontend-service
      - backend-service

  # ============================================================================
  # 2. Frontend Presentation Service (React SPA)
  # ============================================================================
  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    container_name: ces-frontend
    restart: unless-stopped
    env_file:
      - ./frontend-service/.env
    networks:
      - public-net
    depends_on:
      - backend-service

  # ============================================================================
  # 3. Core Backend Service (FastAPI Governance Engine)
  # ============================================================================
  backend-service:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    container_name: ces-backend-service
    restart: unless-stopped
    ports:
      - "8000:8000"   # Direct API access / Gateway routes via port 80
    env_file:
      - ./backend-service/.env
    networks:
      - public-net
      - internal-net
    depends_on:
      postgresql:
        condition: service_healthy
      opa:
        condition: service_started
      redis:
        condition: service_healthy

  # ============================================================================
  # 4. Pluggable Cloud Connectors (Snowflake & Redshift)
  # ============================================================================
  snowflake-connector:
    build:
      context: .
      dockerfile: snowflake-connector/Dockerfile
    container_name: ces-snowflake-connector
    ports:
      - "8006:8006"
    env_file:
      - ./snowflake-connector/.env
    <<: *service-defaults

  redshift-connector:
    build:
      context: .
      dockerfile: redshift-connector/Dockerfile
    container_name: ces-redshift-connector
    ports:
      - "8007:8007"
    env_file:
      - ./redshift-connector/.env
    <<: *service-defaults

  # ============================================================================
  # 5. Core Relational Database (PostgreSQL 16)
  # ============================================================================
  postgresql:
    image: postgres:16-alpine
    container_name: ces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ces_db
      POSTGRES_USER: ces_user
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ces_secret_2024}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema/001_core_domain.sql:/docker-entrypoint-initdb.d/001_core_domain.sql:ro
      - ./database/schema/002_metadata.sql:/docker-entrypoint-initdb.d/002_metadata.sql:ro
      - ./database/schema/003_policies.sql:/docker-entrypoint-initdb.d/003_policies.sql:ro
      - ./database/seeds/004_sample_data.sql:/docker-entrypoint-initdb.d/004_sample_data.sql:ro
    ports:
      - "5433:5432"   # Mapped for developer DBA inspection
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ces_user -d ces_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 6. Open Policy Agent (OPA Engine)
  # ============================================================================
  opa:
    image: openpolicyagent/opa:latest
    container_name: ces-opa
    restart: unless-stopped
    command: run --server --addr :8181 --log-format json --log-level info /policies
    volumes:
      - ./backend-service/rego:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - internal-net

  # ============================================================================
  # 7. Redis Message Broker & Pub/Sub Event Bus
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ces-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 8. Celery Worker Service (Long-Running Task Execution)
  # ============================================================================
  celery-worker:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    container_name: ces-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "src.celery_app.celery", "worker", "--loglevel=info", "-c", "4"]
    env_file:
      - ./backend-service/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://ces_user:${PG_PASSWORD:-ces_secret_2024}@postgresql:5432/ces_db
    networks:
      - internal-net
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 9. Celery Beat Service (1-Hour Periodic Cron Scheduler)
  # ============================================================================
  celery-beat:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    container_name: ces-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "src.celery_app.celery", "beat", "--loglevel=info"]
    env_file:
      - ./backend-service/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://ces_user:${PG_PASSWORD:-ces_secret_2024}@postgresql:5432/ces_db
    networks:
      - internal-net
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy


# ==============================================================================
# Network Topology: Public Ingress & Zero-Trust Isolated Internal Network
# ==============================================================================
networks:
  public-net:
    name: ces-public-net
    driver: bridge
  internal-net:
    name: ces-internal-net
    driver: bridge

volumes:
  pg_data:
