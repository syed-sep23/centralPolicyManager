# ==============================================================================
# Central Entitlement Service (CES) - Docker Compose (Production Architecture)
# Edge API Gateway: Traefik v3 | Dual-Network Zero-Trust Topology
# Service Environment Files: Located inside respective parent directories
# ==============================================================================

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - internal-net
  depends_on:
    postgresql:
      condition: service_healthy

services:
  # ============================================================================
  # 1. Edge API Gateway & Reverse Proxy (Traefik v3)
  # ============================================================================
  traefik:
    image: traefik:v3.1
    container_name: ces-traefik
    restart: unless-stopped
    env_file:
      - ./infrastructure/traefik/.env
    command:
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8080"
      
      # API & Observability Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"
      
      # Docker Provider Configuration
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=ces-public-net"
      
      # Dynamic File Provider (Enterprise Resilience)
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      
      # Logging & Metrics
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=${TRAEFIK_ACCESS_LOG:-true}"
    ports:
      - "${TRAEFIK_WEB_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public-net
      - internal-net
    labels:
      - "traefik.enable=true"
      
      # Global Security Headers Middleware
      - "traefik.http.middlewares.sec-headers.headers.framedeny=false"
      - "traefik.http.middlewares.sec-headers.headers.customframeoptionsvalue=SAMEORIGIN"
      - "traefik.http.middlewares.sec-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.sec-headers.headers.referrerpolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.sec-headers.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH"
      - "traefik.http.middlewares.sec-headers.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.sec-headers.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.sec-headers.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.sec-headers.headers.accesscontrolmaxage=3600"
      
      # Dashboard BasicAuth Middleware (admin / adminpassword123)
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-admin:{SHA}f4MWA2s+v7KxRbCblH2OOyL5dNw=}"
      
      # Traefik Dashboard Router
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      - "traefik.http.routers.dashboard.entrypoints=traefik"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"

  # ============================================================================
  # 2. Frontend Presentation Service (React SPA)
  # ============================================================================
  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    container_name: ces-frontend
    restart: unless-stopped
    env_file:
      - ./frontend-service/.env
    networks:
      - public-net
    depends_on:
      - backend-service
    labels:
      - "traefik.enable=true"
      # SPA Catch-all router (priority 1 so API routes take precedence)
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.middlewares=sec-headers"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # ============================================================================
  # 3. Core Backend Service (FastAPI Governance Engine)
  # ============================================================================
  backend-service:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    container_name: ces-backend-service
    restart: unless-stopped
    ports:
      - "8000:8000"   # Direct API access / Traefik routes via port 80
    env_file:
      - ./backend-service/.env
    networks:
      - public-net
      - internal-net
    depends_on:
      postgresql:
        condition: service_healthy
      opa:
        condition: service_started
      temporal-ns-register:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      # Route all API endpoints, OpenAPI schemas, and documentation via Traefik
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/redoc`) || PathPrefix(`/health`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.routers.backend.middlewares=sec-headers"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  # ============================================================================
  # 4. Pluggable Cloud Connectors (Snowflake & Redshift)
  # ============================================================================
  snowflake-connector:
    build:
      context: .
      dockerfile: snowflake-connector/Dockerfile
    container_name: ces-snowflake-connector
    ports:
      - "8006:8006"
    env_file:
      - ./snowflake-connector/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.snowflake-connector.rule=PathPrefix(`/connectors/snowflake`)"
      - "traefik.http.routers.snowflake-connector.entrypoints=web"
      - "traefik.http.routers.snowflake-connector.priority=200"
      - "traefik.http.middlewares.snowflake-stripprefix.stripprefix.prefixes=/connectors/snowflake"
      - "traefik.http.routers.snowflake-connector.middlewares=sec-headers,snowflake-stripprefix"
      - "traefik.http.services.snowflake-connector.loadbalancer.server.port=8006"
    <<: *service-defaults

  redshift-connector:
    build:
      context: .
      dockerfile: redshift-connector/Dockerfile
    container_name: ces-redshift-connector
    ports:
      - "8007:8007"
    env_file:
      - ./redshift-connector/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redshift-connector.rule=PathPrefix(`/connectors/redshift`)"
      - "traefik.http.routers.redshift-connector.entrypoints=web"
      - "traefik.http.routers.redshift-connector.priority=200"
      - "traefik.http.middlewares.redshift-stripprefix.stripprefix.prefixes=/connectors/redshift"
      - "traefik.http.routers.redshift-connector.middlewares=sec-headers,redshift-stripprefix"
      - "traefik.http.services.redshift-connector.loadbalancer.server.port=8007"
    <<: *service-defaults

  # ============================================================================
  # 5. Core Relational Database (PostgreSQL 16)
  # ============================================================================
  postgresql:
    image: postgres:16-alpine
    container_name: ces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ces_db
      POSTGRES_USER: ces_user
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ces_secret_2024}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema/001_core_domain.sql:/docker-entrypoint-initdb.d/001_core_domain.sql:ro
      - ./database/schema/002_metadata.sql:/docker-entrypoint-initdb.d/002_metadata.sql:ro
      - ./database/schema/003_policies.sql:/docker-entrypoint-initdb.d/003_policies.sql:ro
      - ./database/seeds/004_sample_data.sql:/docker-entrypoint-initdb.d/004_sample_data.sql:ro
    ports:
      - "5433:5432"   # Mapped for developer DBA inspection
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ces_user -d ces_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 6. Open Policy Agent (OPA Engine)
  # ============================================================================
  opa:
    image: openpolicyagent/opa:latest
    container_name: ces-opa
    restart: unless-stopped
    command: run --server --addr :8181 --log-format json --log-level info /policies
    volumes:
      - ./backend-service/rego:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - internal-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opa.rule=PathPrefix(`/opa`) || PathPrefix(`/api/v1/opa`)"
      - "traefik.http.routers.opa.entrypoints=web"
      - "traefik.http.routers.opa.priority=250"
      - "traefik.http.middlewares.opa-stripprefix.stripprefix.prefixes=/api/v1/opa,/opa"
      - "traefik.http.routers.opa.middlewares=sec-headers,opa-stripprefix"
      - "traefik.http.services.opa.loadbalancer.server.port=8181"

  # ============================================================================
  # 7. Temporal Workflow Infrastructure
  # ============================================================================
  temporal-db-init:
    image: postgres:16-alpine
    container_name: ces-temporal-db-init
    environment:
      PGPASSWORD: ${PG_PASSWORD:-ces_secret_2024}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      POSTGRES_SUPERUSER: ces_user
      POSTGRES_DB: ces_db
      TEMPORAL_PG_USER: ${TEMPORAL_PG_USER:-temporal_user}
      TEMPORAL_PG_PASSWORD: ${TEMPORAL_PG_PASSWORD:-temporal_secret_2024}
    volumes:
      - ./infrastructure/temporal/init-temporal-db.sh:/init-temporal-db.sh:ro
    entrypoint: ["sh", "/init-temporal-db.sh"]
    networks:
      - internal-net
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"

  temporal-schema-setup:
    image: temporalio/admin-tools:1.30.1
    container_name: ces-temporal-schema-setup
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      TEMPORAL_PG_USER: ${TEMPORAL_PG_USER:-temporal_user}
      TEMPORAL_PG_PASSWORD: ${TEMPORAL_PG_PASSWORD:-temporal_secret_2024}
    volumes:
      - ./infrastructure/temporal/setup-schema.sh:/setup-schema.sh:ro
    entrypoint: ["sh", "/setup-schema.sh"]
    networks:
      - internal-net
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
    restart: "no"

  temporal:
    image: temporalio/server:1.29.1
    container_name: ces-temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${TEMPORAL_PG_USER:-temporal_user}
      POSTGRES_PWD: ${TEMPORAL_PG_PASSWORD:-temporal_secret_2024}
      POSTGRES_SEEDS: postgresql
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      NUM_HISTORY_SHARDS: "4"
      SERVICES: frontend,history,matching,worker
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/docker.yaml
      LOG_LEVEL: info
    volumes:
      - ./infrastructure/temporal/docker.yaml:/etc/temporal/dynamicconfig/docker.yaml:ro
    ports:
      - "7233:7233"
    networks:
      - internal-net
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully

  temporal-ns-register:
    image: temporalio/admin-tools:1.30.1
    container_name: ces-temporal-ns-register
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      RETENTION: "72h"
    volumes:
      - ./infrastructure/temporal/register-namespace.sh:/register-namespace.sh:ro
    entrypoint: ["sh", "/register-namespace.sh"]
    networks:
      - internal-net
    depends_on:
      temporal:
        condition: service_started
    restart: "no"

  temporal-ui:
    image: temporalio/ui:2.43.3
    container_name: ces-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"   # Temporal UI dashboard
    networks:
      - public-net
      - internal-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.temporal-ui.rule=PathPrefix(`/temporal`)"
      - "traefik.http.routers.temporal-ui.entrypoints=web"
      - "traefik.http.routers.temporal-ui.priority=150"
      - "traefik.http.middlewares.temporal-stripprefix.stripprefix.prefixes=/temporal"
      - "traefik.http.routers.temporal-ui.middlewares=sec-headers,temporal-stripprefix"
      - "traefik.http.services.temporal-ui.loadbalancer.server.port=8080"
    depends_on:
      temporal-ns-register:
        condition: service_completed_successfully

# ==============================================================================
# Network Topology: Public Ingress & Zero-Trust Isolated Internal Network
# ==============================================================================
networks:
  public-net:
    name: ces-public-net
    driver: bridge
  internal-net:
    name: ces-internal-net
    driver: bridge

volumes:
  pg_data:
