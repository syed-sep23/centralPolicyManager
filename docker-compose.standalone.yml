# ==============================================================================
# Central Entitlement Service (CES) - Docker Compose (Standalone / Self-Contained)
# ==============================================================================
#
# STANDALONE VERSION: All Temporal setup scripts are embedded inline.
# No external .sh files required — everything runs from this single YAML file.
#
# Boot Sequence:
#   1. PostgreSQL            -> healthcheck passes
#   2. temporal-db-init      -> creates temporal databases and user (inline)
#   3. temporal-schema-setup -> applies schema migrations (inline)
#   4. temporal              -> starts temporalio/server:1.24
#   5. temporal-ns-register  -> registers default namespace (inline)
#   6. temporal-ui           -> Temporal Web UI
#   7. backend-service       -> CES application services
# ==============================================================================

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ces_user:ces_secret_2024@postgresql:5432/ces_db}
  SECRET_KEY: ${SECRET_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-development}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - ces-net
  depends_on:
    postgresql:
      condition: service_healthy

services:
  # =============================================
  # Primary Database
  # =============================================
  postgresql:
    image: postgres:16-alpine
    container_name: ces-postgres
    environment:
      POSTGRES_DB: ces_db
      POSTGRES_USER: ces_user
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ces_secret_2024}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema/001_core_domain.sql:/docker-entrypoint-initdb.d/001_core_domain.sql:ro
      - ./database/schema/002_metadata.sql:/docker-entrypoint-initdb.d/002_metadata.sql:ro
      - ./database/schema/003_policies.sql:/docker-entrypoint-initdb.d/003_policies.sql:ro
      - ./database/seeds/004_sample_data.sql:/docker-entrypoint-initdb.d/004_sample_data.sql:ro
    ports:
      - "5433:5432"
    networks:
      - ces-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ces_user -d ces_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # =============================================
  # Open Policy Agent
  # =============================================
  opa:
    image: openpolicyagent/opa:latest
    container_name: ces-opa
    command: run --server --addr :8181 --log-format json --log-level info /policies
    volumes:
      - ./backend-service/rego:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - ces-net
    restart: unless-stopped

  # =============================================
  # Temporal Workflow Infrastructure (Production)
  # =============================================
  #
  # All init scripts are embedded inline below.
  # No external script files needed.
  # =============================================

  # --- Step 1: Create Temporal databases and user (inline) ---
  temporal-db-init:
    image: postgres:16-alpine
    container_name: ces-temporal-db-init
    environment:
      PGPASSWORD: ${PG_PASSWORD:-ces_secret_2024}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "=============================================="
        echo "  Temporal Database Initialization"
        echo "=============================================="
        echo "[1/5] Creating temporal_user role..."
        psql -h postgresql -p 5432 -U ces_user -d ces_db \
          -c "CREATE ROLE temporal_user WITH LOGIN PASSWORD 'temporal_secret_2024';" \
          2>/dev/null && echo "  -> Created" || echo "  -> Already exists (skipped)"
        echo "[2/5] Creating database: temporal"
        psql -h postgresql -p 5432 -U ces_user -d ces_db \
          -c "CREATE DATABASE temporal OWNER temporal_user;" \
          2>/dev/null && echo "  -> Created" || echo "  -> Already exists (skipped)"
        echo "[3/5] Creating database: temporal_visibility"
        psql -h postgresql -p 5432 -U ces_user -d ces_db \
          -c "CREATE DATABASE temporal_visibility OWNER temporal_user;" \
          2>/dev/null && echo "  -> Created" || echo "  -> Already exists (skipped)"
        echo "[4/5] Granting privileges on temporal"
        psql -h postgresql -p 5432 -U ces_user -d temporal \
          -c "GRANT ALL ON SCHEMA public TO temporal_user;"
        echo "[5/5] Granting privileges on temporal_visibility"
        psql -h postgresql -p 5432 -U ces_user -d temporal_visibility \
          -c "GRANT ALL ON SCHEMA public TO temporal_user;"
        echo "=============================================="
        echo "  Temporal databases ready"
        echo "=============================================="
    networks:
      - ces-net
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"

  # --- Step 2: Apply Temporal schema migrations (inline) ---
  temporal-schema-setup:
    image: temporalio/admin-tools:1.30.1
    container_name: ces-temporal-schema-setup
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "=============================================="
        echo "  Temporal Schema Migration"
        echo "=============================================="
        echo "[1/4] Initializing 'temporal' base schema..."
        temporal-sql-tool --plugin postgres12 --ep postgresql -p 5432 \
          -u temporal_user --pw temporal_secret_2024 \
          --db temporal setup-schema -v 0.0 \
          2>/dev/null && echo "  -> Done" || echo "  -> Already initialized (skipped)"
        echo "[2/4] Applying 'temporal' versioned migrations..."
        temporal-sql-tool --plugin postgres12 --ep postgresql -p 5432 \
          -u temporal_user --pw temporal_secret_2024 \
          --db temporal update-schema \
          -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        echo "  -> Migrations applied"
        echo "[3/4] Initializing 'temporal_visibility' base schema..."
        temporal-sql-tool --plugin postgres12 --ep postgresql -p 5432 \
          -u temporal_user --pw temporal_secret_2024 \
          --db temporal_visibility setup-schema -v 0.0 \
          2>/dev/null && echo "  -> Done" || echo "  -> Already initialized (skipped)"
        echo "[4/4] Applying 'temporal_visibility' versioned migrations..."
        temporal-sql-tool --plugin postgres12 --ep postgresql -p 5432 \
          -u temporal_user --pw temporal_secret_2024 \
          --db temporal_visibility update-schema \
          -d /etc/temporal/schema/postgresql/v12/visibility/versioned
        echo "  -> Migrations applied"
        echo "=============================================="
        echo "  Schema migration complete"
        echo "=============================================="
    networks:
      - ces-net
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
    restart: "no"

  # --- Step 3: Temporal Server (Production) ---
  # NUM_HISTORY_SHARDS=4 is suitable for dev/staging.
  # For production workloads, increase to 128-512.
  # WARNING: This value CANNOT be changed after initial setup.
  temporal:
    image: temporalio/server:1.29.1
    container_name: ces-temporal
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${TEMPORAL_PG_USER:-temporal_user}
      POSTGRES_PWD: ${TEMPORAL_PG_PASSWORD:-temporal_secret_2024}
      POSTGRES_SEEDS: postgresql
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      NUM_HISTORY_SHARDS: "4"
      SERVICES: frontend,history,matching,worker
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/docker.yaml
      LOG_LEVEL: info
    volumes:
      - ./infrastructure/temporal/docker.yaml:/etc/temporal/dynamicconfig/docker.yaml:ro
    ports:
      - "7233:7233"
    networks:
      - ces-net
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Step 4: Register Temporal namespace (inline) ---
  temporal-ns-register:
    image: temporalio/admin-tools:1.30.1
    container_name: ces-temporal-ns-register
    environment:
      TEMPORAL_CLI_ADDRESS: temporal:7233
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "=============================================="
        echo "  Temporal Namespace Registration"
        echo "=============================================="
        echo "[1/2] Waiting for Temporal server..."
        MAX_RETRIES=60
        RETRY_COUNT=0
        until temporal operator cluster health 2>/dev/null | grep -q SERVING; do
          RETRY_COUNT=$$((RETRY_COUNT + 1))
          if [ "$$RETRY_COUNT" -ge "$$MAX_RETRIES" ]; then
            echo "ERROR: Temporal server not ready after $$MAX_RETRIES attempts"
            exit 1
          fi
          echo "  Attempt $$RETRY_COUNT/$$MAX_RETRIES - retrying in 3s..."
          sleep 3
        done
        echo "  -> Temporal server is SERVING"
        echo "[2/2] Registering namespace: default"
        temporal operator namespace describe --namespace default > /dev/null 2>&1 \
          && echo "  -> Already exists (skipped)" \
          || (temporal operator namespace create \
                --namespace default \
                --retention 72h \
                --description "CES workflow namespace" \
              && echo "  -> Registered successfully")
        echo "=============================================="
        echo "  Namespace registration complete"
        echo "=============================================="
    networks:
      - ces-net
    depends_on:
      temporal:
        condition: service_started
    restart: "no"

  # --- Temporal Web UI ---
  temporal-ui:
    image: temporalio/ui:2.43.3
    container_name: ces-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"   # Temporal UI -> http://localhost:8088
    networks:
      - ces-net
    depends_on:
      temporal-ns-register:
        condition: service_completed_successfully
    restart: unless-stopped

  # =============================================
  # Application Services
  # =============================================

  # --- Consolidated Core Backend Service ---
  backend-service:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    container_name: ces-backend-service
    ports:
      - "8000:8000"   # Core API -> http://localhost:8000
    environment:
      <<: *common-env
      OPA_URL: ${OPA_URL}
      TEMPORAL_HOST: ${TEMPORAL_HOST}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-policy-deployment}
      SNOWFLAKE_CONNECTOR_URL: ${SNOWFLAKE_CONNECTOR_URL}
      REDSHIFT_CONNECTOR_URL: ${REDSHIFT_CONNECTOR_URL}
    <<: *service-defaults
    depends_on:
      postgresql:
        condition: service_healthy
      opa:
        condition: service_started
      temporal-ns-register:
        condition: service_completed_successfully

  # --- Snowflake Connector ---
  snowflake-connector:
    build:
      context: .
      dockerfile: snowflake-connector/Dockerfile
    container_name: ces-snowflake-connector
    environment:
      <<: *common-env
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-demo.us-east-1}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-ces_svc}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-CES_WH}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-SYSADMIN}
    <<: *service-defaults

  # --- Redshift Connector ---
  redshift-connector:
    build:
      context: .
      dockerfile: redshift-connector/Dockerfile
    container_name: ces-redshift-connector
    environment:
      <<: *common-env
      REDSHIFT_HOST: ${REDSHIFT_HOST:-localhost}
      REDSHIFT_PORT: ${REDSHIFT_PORT:-5439}
      REDSHIFT_DB: ${REDSHIFT_DB:-acme_dw}
      REDSHIFT_USER: ${REDSHIFT_USER:-ces_svc}
      REDSHIFT_PASSWORD: ${REDSHIFT_PASSWORD:-}
    <<: *service-defaults

  # --- Frontend Service ---
  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    container_name: ces-frontend
    ports:
      - "80:80"       # Web UI -> http://localhost
    networks:
      - ces-net
    depends_on:
      - backend-service
    restart: unless-stopped

networks:
  ces-net:
    driver: bridge

volumes:
  pg_data:
