# ==============================================================================
# Central Entitlement Service (CES) - Docker Compose (Standalone / Self-Contained)
# ==============================================================================
#
# STANDALONE VERSION: Shared PostgreSQL, Redis, Celery Worker, and Celery Beat.
# No external setup scripts required — everything runs from this single YAML file.
#
# Boot Sequence:
#   1. PostgreSQL       -> healthcheck passes (ces_db)
#   2. Redis            -> healthcheck passes (broker & pub/sub)
#   3. OPA & Connectors -> healthchecks pass (OPA, Snowflake, Redshift)
#   4. Backend Service  -> CES application services & SSE streaming
#   5. Celery Worker    -> policy push execution to cloud engines
#   6. Celery Beat      -> scheduled 1-hour catalog metadata sync
#   7. Frontend & Nginx -> UI control plane & unified gateway
# ==============================================================================

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ces_user:ces_secret_2024@postgresql:5432/ces_db}
  SECRET_KEY: ${SECRET_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-development}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - ces-net
  depends_on:
    postgresql:
      condition: service_healthy

services:
  # =============================================
  # Primary Database
  # =============================================
  postgresql:
    image: postgres:16-alpine
    container_name: ces-postgres
    environment:
      POSTGRES_DB: ces_db
      POSTGRES_USER: ces_user
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ces_secret_2024}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema/001_core_domain.sql:/docker-entrypoint-initdb.d/001_core_domain.sql:ro
      - ./database/schema/002_metadata.sql:/docker-entrypoint-initdb.d/002_metadata.sql:ro
      - ./database/schema/003_policies.sql:/docker-entrypoint-initdb.d/003_policies.sql:ro
      - ./database/seeds/004_sample_data.sql:/docker-entrypoint-initdb.d/004_sample_data.sql:ro
    ports:
      - "5433:5432"
    networks:
      - ces-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ces_user -d ces_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # =============================================
  # Open Policy Agent
  # =============================================
  opa:
    image: openpolicyagent/opa:latest
    container_name: ces-opa
    command: run --server --addr :8181 --log-format json --log-level info /policies
    volumes:
      - ./backend-service/rego:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - ces-net
    restart: unless-stopped  # =============================================
  # Redis Message Broker & Pub/Sub
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: ces-redis
    ports:
      - "6379:6379"
    networks:
      - ces-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # =============================================
  # Celery Worker Service
  # =============================================
  celery-worker:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    container_name: ces-celery-worker
    command: ["celery", "-A", "src.celery_app.celery", "worker", "--loglevel=info", "-c", "4"]
    environment:
      <<: *common-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      SNOWFLAKE_CONNECTOR_URL: http://snowflake-connector:8006
      REDSHIFT_CONNECTOR_URL: http://redshift-connector:8007
    networks:
      - ces-net
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # =============================================
  # Celery Beat Service (1-Hour Cron)
  # =============================================
  celery-beat:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    container_name: ces-celery-beat
    command: ["celery", "-A", "src.celery_app.celery", "beat", "--loglevel=info"]
    environment:
      <<: *common-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      SNOWFLAKE_CONNECTOR_URL: http://snowflake-connector:8006
      REDSHIFT_CONNECTOR_URL: http://redshift-connector:8007
    networks:
      - ces-net
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # =============================================
  # Application Services
  # =============================================

  # --- Consolidated Core Backend Service ---
  backend-service:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    container_name: ces-backend-service
    ports:
      - "8000:8000"   # Core API -> http://localhost:8000
    environment:
      <<: *common-env
      OPA_URL: ${OPA_URL:-http://opa:8181}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      SNOWFLAKE_CONNECTOR_URL: ${SNOWFLAKE_CONNECTOR_URL:-http://snowflake-connector:8006}
      REDSHIFT_CONNECTOR_URL: ${REDSHIFT_CONNECTOR_URL:-http://redshift-connector:8007}
    <<: *service-defaults
    depends_on:
      postgresql:
        condition: service_healthy
      opa:
        condition: service_started
      redis:
        condition: service_healthy


  # --- Snowflake Connector ---
  snowflake-connector:
    build:
      context: .
      dockerfile: snowflake-connector/Dockerfile
    container_name: ces-snowflake-connector
    environment:
      <<: *common-env
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-demo.us-east-1}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-ces_svc}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-CES_WH}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-SYSADMIN}
    <<: *service-defaults

  # --- Redshift Connector ---
  redshift-connector:
    build:
      context: .
      dockerfile: redshift-connector/Dockerfile
    container_name: ces-redshift-connector
    environment:
      <<: *common-env
      REDSHIFT_HOST: ${REDSHIFT_HOST:-localhost}
      REDSHIFT_PORT: ${REDSHIFT_PORT:-5439}
      REDSHIFT_DB: ${REDSHIFT_DB:-acme_dw}
      REDSHIFT_USER: ${REDSHIFT_USER:-ces_svc}
      REDSHIFT_PASSWORD: ${REDSHIFT_PASSWORD:-}
    <<: *service-defaults

  # --- Frontend Service ---
  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    container_name: ces-frontend
    ports:
      - "80:80"       # Web UI -> http://localhost
    networks:
      - ces-net
    depends_on:
      - backend-service
    restart: unless-stopped

networks:
  ces-net:
    driver: bridge

volumes:
  pg_data:
